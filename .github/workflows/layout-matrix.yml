name: KOVCHEG CMS Layout Matrix

on:
  push:
    branches: [main, feature/posts-menus-widgets-3.8.0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint Layout Matrix PHP
        run: |
          php -l app/bootstrap.php
          php -l app/BlogLayout.php
          php -l app/BlogLayoutRepair.php
          php -l app/BlogEssentialWidgets.php
          php -l app/BlogCmsWidgetOverrides.php
          php -l app/BlogThemeSupport.php
          php -l modules/layout-matrix/bootstrap.php
          php -l routes/blog-layout.php
          php -l views/studio/widgets.php
          php -l themes/kovcheg-portal/layout.php
          php -l themes/kovcheg-editorial/layout.php
          php -l scripts/audit-cms-core-3.8.php
      - name: CMS Layout widgets audit
        run: php scripts/audit-cms-core-3.8.php
      - name: Login and account audit
        run: |
          php scripts/audit-login-routing.php
          php scripts/audit-account-actions.php
      - name: Portal UI audit
        run: php scripts/audit-portal-ui.php
      - name: Validate manifests
        run: |
          php -r 'json_decode(file_get_contents("modules/layout-matrix/manifest.json"),true,512,JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("themes/kovcheg-portal/theme.json"),true,512,JSON_THROW_ON_ERROR);'
