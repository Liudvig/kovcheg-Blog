          file_sha=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPOSITORY}/contents/docs/DEVELOPMENT_LOG.md?ref=${TARGET_BRANCH}" | jq -r '.sha')
          encoded=$(base64 -w0 docs/DEVELOPMENT_LOG.md)
          jq -n \
            --arg message 'Document KOVCHEG CMS 3.8.0 [development-log-appended]' \
            --arg content "$encoded" \
            --arg sha "$file_sha" \
            --arg branch "$TARGET_BRANCH" \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/update.json
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/contents/docs/DEVELOPMENT_LOG.md" \
            --data-binary @/tmp/update.json | jq -e '.commit.sha'
