name: KOVCHEG 3.9 Finalize Cleanup Documentation

on:
  push:
    branches: [feature/core-cleanup-3.9.0]
    paths:
      - '.github/workflows/finalize-core-cleanup-docs-3.9.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify cleanup state before documenting
        shell: bash
        run: |
          set -euo pipefail
          php -l app/functions.php
          php scripts/audit-core-cleanup-3.9.php
          php scripts/audit-active-runtime-social-free.php
          php scripts/report-function-usage-3.9.php
      - name: Synchronize project documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          marker = 'KOVCHEG_3_9_SOCIAL_HELPER_CLEANUP_FINAL'

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          if marker not in text:
              text += f'''\n\n### Завершение очистки social helpers\n\n<!-- {marker} -->\n- `app/functions.php` проверен токенизированным call-graph аудитом;\n- недостижимые chat/channel/message/wall/profile/follow/colleague/story/push helpers удалены;\n- активный runtime не обращается к retired social tables и social URL helpers;\n- `scripts/report-function-usage-3.9.php` теперь валит CI, если social helper определения появляются снова;\n- одноразовые prune workflows после выполнения удалены;\n- destructive удаление старых production-таблиц по-прежнему не выполняется автоматически.\n'''
              readme.write_text(text, encoding='utf-8')

          memory = Path('PROJECT_MEMORY.md')
          text = memory.read_text(encoding='utf-8')
          if marker not in text:
              text += f'''\n\n## Завершение Social Helper Cleanup — 2026-08-09\n\n<!-- {marker} -->\n- построен token-based call graph для `app/functions.php`;\n- до prune было 164 глобальные функции: 52 reachable, 112 unreachable; social-pattern анализ подтвердил 0 reachable social candidates;\n- exact-name и затем общий unreachable-social prune выполнялись только после проверки достижимости и `php -l`;\n- удалён недостижимый social helper cluster из `app/functions.php`;\n- постоянный `scripts/report-function-usage-3.9.php` теперь является fail-guard: наличие social helper definitions приводит к ошибке CI;\n- `scripts/audit-active-runtime-social-free.php` отдельно запрещает активным routes/themes/modules/views/cron/app обращаться к chats/messages/wall/follows/stories/push и retired social URL helpers;\n- удалены временные prune/report workflows и одноразовые инструменты;\n- production legacy tables не удалялись и требуют отдельного backup/data audit перед destructive migration.\n'''
              memory.write_text(text, encoding='utf-8')

          module_log = Path('docs/MODULE-IMPLEMENTATION-LOG.md')
          text = module_log.read_text(encoding='utf-8')
          if marker not in text:
              text += f'''\n\n## Social Helper Runtime Cleanup\n\n<!-- {marker} -->\n| Слой | Статус | Проверка |\n|---|---|---|\n| Active social views | REMOVED | Core Cleanup audit |\n| Fresh social DB baseline | REMOVED | MariaDB/MySQL assertions |\n| Active social DB dependencies | REMOVED | `audit-active-runtime-social-free.php` |\n| Social helpers in `app/functions.php` | REMOVED | token call graph + `report-function-usage-3.9.php` |\n| Production legacy data | PRESERVED | удалить только после backup/data audit |\n\nPortal Media Widgets также очищен от VK Video и retired `portfolio` content type; bundled metadata обновлена до 1.0.1 / min core 3.9.0.\n'''
              module_log.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if marker not in text:
              block = f'''\n### Завершение social helper cleanup\n\n<!-- {marker} -->\n- построен token-based call graph `app/functions.php`;\n- подтверждено отсутствие reachable social helpers;\n- недостижимые chat/channel/message/wall/profile/follow/colleague/story/push helpers физически удалены;\n- добавлен постоянный CI fail-guard против возврата social helper definitions;\n- активные routes/themes/modules/views/cron/app отдельно проверяются на отсутствие social DB dependencies;\n- старые production social tables не дропаются автоматически и остаются предметом отдельного data audit.\n\n'''
              anchor = '\n## 3.4.1 —'
              if anchor in text:
                  text = text.replace(anchor, block + anchor, 1)
              else:
                  text += block
              changelog.write_text(text, encoding='utf-8')

          devlog = Path('docs/DEVELOPMENT_LOG.md')
          text = devlog.read_text(encoding='utf-8')
          if marker not in text:
              block = f'''\n## 2026-08-09 — KOVCHEG Blog 3.9.0 Deep Social Helper Cleanup\n\n<!-- {marker} -->\nВерсия: KOVCHEG Blog 3.9.0 Core Cleanup\nВетка: feature/core-cleanup-3.9.0\n\nЧто выполнено:\n- после удаления social presentation-layer и fresh social DB baseline построен call graph глобальных helpers;\n- анализ `app/functions.php` подтвердил отсутствие reachable social candidates;\n- недостижимый social helper cluster удалён автоматическим token-based prune, который abort'ится при любой reachable цели;\n- после prune выполнены PHP lint и повторный reachability audit;\n- постоянный function-usage guard теперь запрещает возвращение social helper definitions;\n- Active Runtime Social-Free audit запрещает обращения текущих routes/themes/modules/views/cron/app к retired social DB и URL helpers;\n- удалены бесхозные legacy assets и orphan Essential Widgets component;\n- исправлен stale require удалённого Essential Widgets в `routes/blog-layout.php`, найденный диагностическим HTTP smoke;\n- Portal Media Widgets очищен от VK Video/portfolio и обновлён до 1.0.1;\n- production legacy tables не удалялись.\n\nПроверка перед записью журнала:\n- `php -l app/functions.php`;\n- `php scripts/audit-core-cleanup-3.9.php`;\n- `php scripts/audit-active-runtime-social-free.php`;\n- `php scripts/report-function-usage-3.9.php`.\n\nProduction:\n3.9.0 пока не деплоился; server/FastPanel/production DB verification остаётся следующим отдельным этапом.\n\nСтатус:\nSOCIAL RUNTIME CLEANUP COMPLETE — PRODUCTION DEPLOY PENDING\n\n---\n'''
              first_sep = text.find('\n---\n')
              if first_sep >= 0:
                  pos = first_sep + len('\n---\n')
                  text = text[:pos] + block + text[pos:]
              else:
                  text = block + text
              devlog.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Remove temporary one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/function-report-3.9.yml \
            .github/workflows/function-report-commit-3.9.yml \
            .github/workflows/function-prune-remaining-3.9.yml \
            .github/workflows/cleanup-temp-core-cleanup-3.9.yml \
            .github/workflows/finalize-core-cleanup-docs-3.9.yml \
            scripts/prune-remaining-social-functions-3.9.php \
            docs/audits/TEMP_FUNCTION_USAGE_3.9.txt
      - name: Commit documentation state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Documentation already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROJECT_MEMORY.md CHANGELOG.md docs/DEVELOPMENT_LOG.md docs/MODULE-IMPLEMENTATION-LOG.md
          git add -u
          git commit -m 'Document completed 3.9 social runtime cleanup'
          git push origin HEAD:feature/core-cleanup-3.9.0
