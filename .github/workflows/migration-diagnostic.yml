name: KOVCHEG migration retry diagnostic

on:
  push:
    branches: [feature/page-category-core-3.7.0]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kovcheg
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo
          coverage: none
      - name: Prepare database
        run: |
          mkdir -p config storage/cache storage/logs storage/uploads storage/backups storage/builds
          chmod -R 777 storage
          cat > config/config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'KOVCHEG CMS CI','url'=>'http://127.0.0.1','timezone'=>'UTC','debug'=>true,'key'=>'base64:'.base64_encode(str_repeat('k',32))],
            'database'=>['driver'=>'mysql','host'=>'127.0.0.1','port'=>3306,'name'=>'kovcheg','user'=>'root','password'=>'root','charset'=>'utf8mb4'],
          ];
          PHP
          php -r '$schema=require "database/schema.php"; file_put_contents("/tmp/schema.sql",$schema);'
          MYSQL_PWD=root mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root kovcheg < /tmp/schema.sql
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do MYSQL_PWD=root mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root kovcheg < "$migration"; done
      - name: Retry through migration runner
        shell: bash
        run: |
          set +e
          output=$(php bin/migrate.php 2>&1)
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            message=$(printf '%s' "$output" | tr '\n' ' ' | sed 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error::${message}"
          fi
          exit "$code"
