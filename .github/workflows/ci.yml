name: KOVCHEG CMS checks

on:
  push:
    branches: [main, feature/posts-menus-widgets-3.8.0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: kovcheg_ci_root
          MARIADB_DATABASE: kovcheg_ci
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kovcheg_mysql_root
          MYSQL_DATABASE: kovcheg_mysql_ci
        ports: [3307:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pkovcheg_mysql_root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, fileinfo, openssl, pdo_mysql, zip, dom

      - name: Lint PHP
        shell: bash
        run: find . -path './.git' -prune -o -path './vendor' -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Check JavaScript syntax
        shell: bash
        run: |
          files=$(find assets themes modules -type f -name '*.js' 2>/dev/null || true)
          if [ -n "$files" ]; then while IFS= read -r file; do node --check "$file"; done <<< "$files"; fi

      - name: Validate JSON
        shell: bash
        run: while IFS= read -r -d '' file; do php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "$file"; done < <(find . -path './.git' -prune -o -type f -name '*.json' -print0)

      - name: Run product audits
        run: |
          php scripts/audit-cms-core-3.8.php
          php scripts/audit-login-routing.php
          php scripts/audit-account-actions.php
          php scripts/audit-classic-editor.php
          php scripts/audit-studio-compact.php
          php scripts/audit-portal-ui.php

      - name: Validate schema and migrations on MariaDB and MySQL
        shell: bash
        run: |
          set -euo pipefail
          php -r '$schema=require "database/schema.php"; if(!is_string($schema)||trim($schema)==="") exit(1); file_put_contents("/tmp/kovcheg-schema.sql",$schema);'
          apply_database() {
            local label="$1" port="$2" database="$3" password="$4"
            echo "=== ${label}: base schema ==="
            MYSQL_PWD="$password" mysql --protocol=tcp -h 127.0.0.1 -P "$port" -u root "$database" < /tmp/kovcheg-schema.sql
            echo "=== ${label}: migrations ==="
            for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
              MYSQL_PWD="$password" mysql --protocol=tcp -h 127.0.0.1 -P "$port" -u root "$database" < "$migration"
            done
            MYSQL_PWD="$password" mysql --protocol=tcp -h 127.0.0.1 -P "$port" -u root -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='${database}' AND table_name IN ('content_entries','content_categories','content_entry_categories','content_comments','media_library','navigation_menus','navigation_items');" | grep -qx '7'
            MYSQL_PWD="$password" mysql --protocol=tcp -h 127.0.0.1 -P "$port" -u root -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='${database}' AND table_name IN ('site_layouts','site_widget_instances','site_widget_placements','site_layout_revisions');" | grep -qx '4'
            MYSQL_PWD="$password" mysql --protocol=tcp -h 127.0.0.1 -P "$port" -u root "$database" -N -e "SELECT COUNT(*) FROM content_entries WHERE type='portfolio';" | grep -qx '0'
            MYSQL_PWD="$password" mysql --protocol=tcp -h 127.0.0.1 -P "$port" -u root "$database" -N -e "SELECT COUNT(*) FROM content_entry_categories ec JOIN content_entries e ON e.id=ec.entry_id WHERE e.type='page';" | grep -qx '0'
            MYSQL_PWD="$password" mysql --protocol=tcp -h 127.0.0.1 -P "$port" -u root "$database" -N -e "SELECT COUNT(*) FROM site_widget_placements p JOIN site_widget_instances w ON w.id=p.widget_id WHERE w.system_key IN ('portal-section-menu','portal-default-search','default-subscription','portal-footer-note');" | grep -qx '0'
            MYSQL_PWD="$password" mysql --protocol=tcp -h 127.0.0.1 -P "$port" -u root "$database" -N -e "SELECT COUNT(*) FROM site_widget_instances WHERE system_key IN ('portal-section-menu','portal-default-search','default-subscription','portal-footer-note') AND is_enabled=1;" | grep -qx '0'
          }
          apply_database "MariaDB 11" 3306 kovcheg_ci kovcheg_ci_root
          apply_database "MySQL 8.4" 3307 kovcheg_mysql_ci kovcheg_mysql_root

      - name: Runtime and HTTP smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p config storage/logs storage/cache storage/uploads storage/backups storage/builds
          cat > config/config.php <<'PHP'
          <?php
          return [
              'app'=>['name'=>'KOVCHEG CMS CI','url'=>'http://127.0.0.1:8099','timezone'=>'UTC','debug'=>true,'key'=>'base64:'.base64_encode(str_repeat('K',32))],
              'database'=>['driver'=>'mysql','host'=>'127.0.0.1','port'=>3306,'name'=>'kovcheg_ci','user'=>'root','password'=>'kovcheg_ci_root','charset'=>'utf8mb4'],
          ];
          PHP
          php -r '
            $_SERVER["SCRIPT_NAME"]="cli";
            require "app/bootstrap.php";
            require_once "app/BlogLayoutRepair.php";
            require_once "app/BlogEssentialWidgets.php";
            require_once "app/BlogCmsWidgetOverrides.php";
            Kovcheg\Blog\EssentialWidgets::boot();
            Kovcheg\Blog\CmsWidgetOverrides::boot();
            Kovcheg\Blog\LayoutRepair::ensure();
            Kovcheg\Blog\LayoutRepair::repair(true);
            foreach(["core.menu","core.categories","core.auth-form","core.content-slider","core.media","core.media-slider","core.category-calendar"] as $type){
              if(!Kovcheg\Blog\Layout::widgetType($type)){fwrite(STDERR,"Missing widget: {$type}\n");exit(2);}
            }
            $required=(int)(Kovcheg\DB::one("SELECT COUNT(*) c FROM site_widget_instances WHERE system_key IN (\"default-logo\",\"default-menu\",\"default-account\") AND is_enabled=1")["c"]??0);
            if($required!==3){fwrite(STDERR,"Minimal header widgets: {$required}\n");exit(3);}
            $forced=(int)(Kovcheg\DB::one("SELECT COUNT(*) c FROM site_widget_placements p JOIN site_widget_instances w ON w.id=p.widget_id WHERE w.system_key IN (\"portal-section-menu\",\"portal-default-search\",\"default-subscription\",\"portal-footer-note\")")["c"]??0);
            if($forced!==0){fwrite(STDERR,"Forced optional placements: {$forced}\n");exit(4);}
            echo "Runtime widgets OK\n";
          '
          php -S 127.0.0.1:8099 index.php >/tmp/kovcheg-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/kovcheg-http.log || true' EXIT
          for attempt in $(seq 1 30); do if curl -fsS http://127.0.0.1:8099/ >/dev/null; then break; fi; sleep 1; done
          for path in / /blog /portfolio /login; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "http://127.0.0.1:8099${path}")
            echo "$path -> $code"
            test "$code" = "200"
          done
          grep -q 'KOVCHEG' /tmp/body
          for path in /studio /studio/posts /studio/pages /studio/categories /studio/menus /studio/widgets; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099${path}")
            echo "$path -> $code"
            test "$code" = "302"
          done
          kill "$server_pid"; wait "$server_pid" 2>/dev/null || true
          trap - EXIT
          rm -f config/config.php

      - name: Reject committed secrets and runtime data
        shell: bash
        run: |
          test ! -f config/config.php
          test ! -f .env
          if find storage/uploads storage/cache storage/logs storage/backups storage/builds -type f ! -name '.gitkeep' -print -quit 2>/dev/null | grep -q .; then echo 'Runtime or user data must not be committed.' >&2; exit 1; fi
          if grep -RInE --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.webp' '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{20,})' .; then echo 'Possible secret found.' >&2; exit 1; fi
