name: KOVCHEG 3.9 Remaining Social Prune

on:
  push:
    branches: [feature/core-cleanup-3.9.0]
    paths:
      - '.github/workflows/function-prune-remaining-3.9.yml'
      - 'scripts/prune-remaining-social-functions-3.9.php'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Prune remaining unreachable social helpers
        shell: bash
        run: |
          set -euo pipefail
          php scripts/prune-remaining-social-functions-3.9.php --write
          php -l app/functions.php
          php scripts/report-function-usage-3.9.php
          git diff --check
      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/functions.php; then
            echo 'No remaining social helper changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/functions.php
          git commit -m 'Remove remaining unreachable social helpers'
          git push origin HEAD:feature/core-cleanup-3.9.0
