name: KOVCHEG Studio compact UX checks

on:
  push:
    branches: [main, feature/posts-menus-widgets-3.8.0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: dom, mbstring, fileinfo
      - name: PHP syntax
        run: |
          php -l app/bootstrap.php
          php -l routes/blog-content-model.php
          php -l routes/blog-menus.php
          php -l routes/blog-ux-fixes.php
          php -l views/studio/layout.php
          php -l views/studio/content-editor.php
          php -l views/studio/content-list.php
          php -l views/studio/menus.php
          php -l scripts/audit-classic-editor.php
          php -l scripts/audit-studio-compact.php
      - name: JavaScript syntax
        run: node --check assets/js/blog-classic-editor.js
      - name: Product audits
        run: |
          php scripts/audit-classic-editor.php
          php scripts/audit-studio-compact.php
          php scripts/audit-cms-core-3.8.php
