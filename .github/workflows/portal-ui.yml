name: KOVCHEG Portal UI checks

on:
  push:
    branches:
      - feature/portal-ui-repair-3.5.5
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  portal-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint Portal PHP
        run: |
          php -l themes/kovcheg-portal/layout.php
          php -l app/bootstrap.php
          php -l scripts/audit-portal-ui.php
      - name: Audit Portal UI repair
        run: php scripts/audit-portal-ui.php
