name: KOVCHEG 3.9 Function Report

on:
  push:
    branches: [feature/core-cleanup-3.9.0]
    paths:
      - '.github/workflows/function-report-3.9.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Generate function usage report
        shell: bash
        run: |
          set +e
          php scripts/report-function-usage-3.9.php > /tmp/function-usage.txt 2>&1
          status=$?
          cat /tmp/function-usage.txt
          echo "$status" > /tmp/function-usage-exit-code.txt
          exit 0
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kovcheg-function-usage-${{ github.run_id }}
          path: |
            /tmp/function-usage.txt
            /tmp/function-usage-exit-code.txt
          retention-days: 1
