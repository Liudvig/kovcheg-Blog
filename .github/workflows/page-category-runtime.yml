name: KOVCHEG Pages runtime checks

on:
  push:
    branches: [main, feature/page-category-core-3.7.0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kovcheg
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_mysql, mbstring, dom, fileinfo
      - name: Runtime config
        run: |
          mkdir -p config storage/cache storage/logs storage/uploads storage/backups storage/builds
          chmod -R 777 storage
          cat > config/config.php <<'PHP'
          <?php
          return [
            'app'=>[
              'name'=>'KOVCHEG CMS CI',
              'url'=>'http://127.0.0.1:8099',
              'base_path'=>'',
              'timezone'=>'UTC',
              'debug'=>true,
              'key'=>'base64:'.base64_encode(str_repeat('k',32)),
            ],
            'database'=>[
              'driver'=>'mysql',
              'host'=>'127.0.0.1',
              'port'=>3306,
              'name'=>'kovcheg',
              'user'=>'root',
              'password'=>'root',
              'charset'=>'utf8mb4',
            ],
          ];
          PHP
      - name: Initialize schema
        run: |
          php -r '$schema=require "database/schema.php"; if(!is_string($schema)||trim($schema)==="") exit(1); file_put_contents("/tmp/kovcheg-schema.sql",$schema);'
          MYSQL_PWD=root mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root kovcheg < /tmp/kovcheg-schema.sql
      - name: Apply migrations
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying ${migration}"
            MYSQL_PWD=root mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root kovcheg < "$migration"
          done
      - name: Active lightweight runtime classes
        run: |
          php -r 'require "app/Core.php"; require "app/BlogLayout.php"; exit(class_exists("Kovcheg\\Blog\\Layout")&&method_exists("Kovcheg\\Blog\\Layout","registerWidget")&&method_exists("Kovcheg\\Blog\\Layout","widgetTypes")?0:1);'
          php -r 'require "app/Core.php"; require "app/BlogStudio.php"; require "app/ClassicEditor.php"; require "app/BlogStudio32.php"; exit(class_exists("Kovcheg\\Blog\\Studio32")?0:1);'
      - name: Migration runner
        run: php bin/migrate.php
      - name: Scheduled publishing
        run: php bin/publish-scheduled.php
      - name: Activate Portal
        run: |
          php -r '
            $_SERVER["SCRIPT_NAME"]="cli";
            require "app/bootstrap.php";
            \Kovcheg\Blog\Studio::setSetting("blog_theme","kovcheg-portal");
            \Kovcheg\Blog\Studio::setSetting("site_name","KOVCHEG CMS CI");
            \Kovcheg\Blog\Studio::setSetting("search_indexing","0");
            \Kovcheg\DB::run("UPDATE themes SET is_active=(slug=?)",["kovcheg-portal"]);
          '
      - name: Repair and render Portal layout
        run: |
          php -r '
            $_SERVER["SCRIPT_NAME"]="cli";
            require "app/bootstrap.php";
            require_once "app/BlogLayoutRepair.php";
            \Kovcheg\Blog\LayoutRepair::ensure();
            \Kovcheg\Blog\LayoutRepair::repair(true);
            $zones=\Kovcheg\Blog\Layout::zones();
            if((string)($zones["matrix.header.3"]??"")==="")exit(1);
            if((string)($zones["matrix.left.1"]??"")==="")exit(1);
            if((string)($zones["matrix.right.1"]??"")==="")exit(1);
            if((string)($zones["matrix.footer.8"]??"")==="")exit(1);
            $header=\Kovcheg\Blog\Layout::renderZone("matrix.header.3",["page_type"=>"home"]);
            $left=\Kovcheg\Blog\Layout::renderZone("matrix.left.1",["page_type"=>"home"]);
            $right=\Kovcheg\Blog\Layout::renderZone("matrix.right.1",["page_type"=>"home"]);
            $footer=\Kovcheg\Blog\Layout::renderZone("matrix.footer.8",["page_type"=>"home"]);
            if(!str_contains($header,"data-layout-zone=\"matrix.header.3\""))exit(2);
            if(!str_contains($left,"data-layout-zone=\"matrix.left.1\""))exit(3);
            if(!str_contains($right,"data-layout-zone=\"matrix.right.1\""))exit(4);
            if(!str_contains($footer,"data-layout-zone=\"matrix.footer.8\""))exit(5);
          '
      - name: Start PHP server
        run: |
          php -S 127.0.0.1:8099 index.php > /tmp/kovcheg-runtime.log 2>&1 &
          echo $! > /tmp/kovcheg-runtime.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/ >/dev/null; then break; fi
            sleep 1
          done
      - name: Home route
        run: |
          curl --fail-with-body -sS -D /tmp/home.headers http://127.0.0.1:8099/ -o /tmp/home.html
          grep -qi '^Content-Type: text/html' /tmp/home.headers
          grep -q 'data-layout-zone="matrix.header.3"' /tmp/home.html
          grep -q 'portal-matrix-sidebar portal-matrix-sidebar--left' /tmp/home.html
          grep -q 'portal-matrix-sidebar portal-matrix-sidebar--right' /tmp/home.html
          grep -q 'portal-matrix-footer-grid' /tmp/home.html
          grep -q 'Ланцет Семён Борисович' /tmp/home.html
      - name: Legacy Blog alias
        run: |
          curl --fail-with-body -sS -D /tmp/blog.headers 'http://127.0.0.1:8099/blog?__kovcheg_route=/blog' -o /tmp/blog.html
          grep -qi '^Content-Type: text/html' /tmp/blog.headers
      - name: Legacy Portfolio alias
        run: |
          curl --fail-with-body -sS -D /tmp/portfolio.headers 'http://127.0.0.1:8099/portfolio?__kovcheg_route=/portfolio' -o /tmp/portfolio.html
          grep -qi '^Content-Type: text/html' /tmp/portfolio.headers
      - name: XML and robots routes
        run: |
          curl --fail-with-body -sS -D /tmp/sitemap.headers 'http://127.0.0.1:8099/sitemap.xml?__kovcheg_route=/sitemap.xml' -o /tmp/sitemap.xml
          grep -qi '^Content-Type: application/xml' /tmp/sitemap.headers
          curl --fail-with-body -sS -D /tmp/feed.headers 'http://127.0.0.1:8099/feed.xml?__kovcheg_route=/feed.xml' -o /tmp/feed.xml
          grep -qi '^Content-Type: application/rss+xml' /tmp/feed.headers
          curl --fail-with-body -sS -D /tmp/robots.headers 'http://127.0.0.1:8099/robots.txt?__kovcheg_route=/robots.txt' -o /tmp/robots.txt
          grep -qi '^Content-Type: text/plain' /tmp/robots.headers
      - name: Studio route
        run: curl --fail-with-body -sS -D /tmp/studio.headers http://127.0.0.1:8099/studio -o /tmp/studio.html
      - name: Runtime log
        if: always()
        run: cat /tmp/kovcheg-runtime.log || true
