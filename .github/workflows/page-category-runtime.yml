name: KOVCHEG Posts and Pages runtime checks

on:
  push:
    branches: [main, feature/posts-menus-widgets-3.8.0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kovcheg
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_mysql, mbstring, dom, fileinfo
      - name: Runtime config
        run: |
          mkdir -p config storage/cache storage/logs storage/uploads storage/backups storage/builds
          chmod -R 777 storage
          cat > config/config.php <<'PHP'
          <?php
          return [
            'app'=>[
              'name'=>'KOVCHEG CMS CI',
              'url'=>'http://127.0.0.1:8099',
              'base_path'=>'',
              'timezone'=>'UTC',
              'debug'=>true,
              'key'=>'base64:'.base64_encode(str_repeat('k',32)),
            ],
            'database'=>[
              'driver'=>'mysql',
              'host'=>'127.0.0.1',
              'port'=>3306,
              'name'=>'kovcheg',
              'user'=>'root',
              'password'=>'root',
              'charset'=>'utf8mb4',
            ],
          ];
          PHP
      - name: Initialize schema
        run: |
          php -r '$schema=require "database/schema.php"; if(!is_string($schema)||trim($schema)==="") exit(1); file_put_contents("/tmp/kovcheg-schema.sql",$schema);'
          MYSQL_PWD=root mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root kovcheg < /tmp/kovcheg-schema.sql
      - name: Apply migrations
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying ${migration}"
            MYSQL_PWD=root mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root kovcheg < "$migration"
          done
      - name: Migration runner
        run: php bin/migrate.php
      - name: Scheduled publishing
        run: php bin/publish-scheduled.php
      - name: Activate Portal
        run: |
          php -r '
            $_SERVER["SCRIPT_NAME"]="cli";
            require "app/bootstrap.php";
            \Kovcheg\Blog\Studio::setSetting("blog_theme","kovcheg-portal");
            \Kovcheg\Blog\Studio::setSetting("site_name","KOVCHEG CMS CI");
            \Kovcheg\Blog\Studio::setSetting("search_indexing","0");
            \Kovcheg\DB::run("UPDATE themes SET is_active=(slug=?)",["kovcheg-portal"]);
          '
      - name: Repair minimal header and verify optional zones
        run: |
          php -r '
            $_SERVER["SCRIPT_NAME"]="cli";
            require "app/bootstrap.php";
            require_once "app/BlogLayoutRepair.php";
            require_once "app/BlogEssentialWidgets.php";
            require_once "app/BlogCmsWidgetOverrides.php";
            \Kovcheg\Blog\EssentialWidgets::boot();
            \Kovcheg\Blog\CmsWidgetOverrides::boot();
            \Kovcheg\Blog\LayoutRepair::ensure();
            \Kovcheg\Blog\LayoutRepair::repair(true);
            $zones=\Kovcheg\Blog\Layout::zones();
            foreach(["matrix.header.3","matrix.left.1","matrix.right.1","matrix.footer.8"] as $zone)if(!isset($zones[$zone]))exit(1);
            $header=\Kovcheg\Blog\Layout::renderZone("matrix.header.3",["page_type"=>"home"]);
            if(!str_contains($header,"data-layout-zone=\"matrix.header.3\""))exit(2);
            foreach(["matrix.left.1","matrix.right.1","matrix.footer.8"] as $zone){
              $html=\Kovcheg\Blog\Layout::renderZone($zone,["page_type"=>"home"]);
              if($html!=="")exit(3);
            }
            foreach(["core.menu","core.categories","core.auth-form","core.content-slider","core.media","core.media-slider","core.category-calendar"] as $type)if(!\Kovcheg\Blog\Layout::widgetType($type))exit(4);
          '
      - name: Create published Post and Page
        run: |
          php -r '
            $_SERVER["SCRIPT_NAME"]="cli";
            require "app/bootstrap.php";
            $user=\Kovcheg\DB::one("SELECT id FROM users ORDER BY id LIMIT 1");
            if(!$user)exit(1);
            $uid=(int)$user["id"];
            \Kovcheg\DB::run("INSERT INTO content_entries (author_id,type,status,title,slug,content_html,visibility,published_at,created_at,updated_at) VALUES (?,\"post\",\"published\",\"Тестовая запись\",\"test-post\",\"<p>Текст записи</p>\",\"public\",CURRENT_TIMESTAMP,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP)",[$uid]);
            \Kovcheg\DB::run("INSERT INTO content_entries (author_id,type,status,title,slug,content_html,visibility,published_at,created_at,updated_at) VALUES (?,\"page\",\"published\",\"Тестовая страница\",\"test-page\",\"<p>Текст страницы</p>\",\"public\",CURRENT_TIMESTAMP,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP)",[$uid]);
          '
      - name: Start PHP server
        run: |
          php -S 127.0.0.1:8099 index.php > /tmp/kovcheg-runtime.log 2>&1 &
          echo $! > /tmp/kovcheg-runtime.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/ >/dev/null; then break; fi
            sleep 1
          done
      - name: Public routes
        run: |
          for path in / /blog /portfolio /post/test-post /page/test-page; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "http://127.0.0.1:8099${path}")
            echo "$path -> $code"
            test "$code" = "200"
          done
          curl -fsS http://127.0.0.1:8099/ | grep -q 'Тестовая запись'
          curl -fsS http://127.0.0.1:8099/post/test-post | grep -q 'Текст записи'
          curl -fsS http://127.0.0.1:8099/page/test-page | grep -q 'Текст страницы'
      - name: Studio redirects unauthenticated visitors
        run: |
          for path in /studio /studio/posts /studio/pages /studio/categories /studio/menus /studio/widgets; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099${path}")
            test "$code" = "302"
          done
      - name: Runtime log
        if: always()
        run: cat /tmp/kovcheg-runtime.log || true
