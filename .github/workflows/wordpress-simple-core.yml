name: KOVCHEG Pages and Rubrics checks

on:
  push:
    branches: [main, feature/page-category-core-3.7.0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: dom, mbstring, fileinfo
      - name: PHP syntax
        run: |
          php -l app/bootstrap.php
          php -l app/Blog.php
          php -l app/BlogStudio32.php
          php -l index.php
          php -l routes/blog-wordpress-mode.php
          php -l routes/blog-wordpress-compat.php
          php -l routes/blog-entry-routing.php
          php -l routes/blog-ux-fixes.php
          php -l views/studio/layout.php
          php -l views/studio/dashboard.php
          php -l views/studio/entries-index.php
          php -l views/studio/wp-editor.php
          php -l views/studio/categories.php
          php -l views/studio/menus.php
          php -l themes/kovcheg-portal/home.php
          php -l themes/kovcheg-portal/archive.php
          php -l themes/kovcheg-portal/page.php
          php -l themes/kovcheg-portal/layout.php
          php -l themes/kovcheg-editorial/home.php
          php -l themes/kovcheg-editorial/archive.php
          php -l themes/kovcheg-editorial/page.php
          php -l themes/kovcheg-portfolio/page.php
          php -l scripts/audit-page-category-core.php
      - name: JavaScript syntax
        run: node --check assets/js/blog-classic-editor.js
      - name: Pages and Rubrics core audit
        run: php scripts/audit-page-category-core.php
      - name: Public UI audit
        run: php scripts/audit-simple-blog.php
      - name: Page routing audit
        run: php scripts/audit-entry-routing.php
      - name: Public Page view audit
        run: php scripts/audit-page-final-view.php
      - name: Classic editor audit
        run: php scripts/audit-classic-editor.php
      - name: Compact Studio audit
        run: php scripts/audit-studio-compact.php
      - name: Portal UI audit
        run: php scripts/audit-portal-ui.php
